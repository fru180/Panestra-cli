name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --verbose
      - run: brew install tmux
      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -o /tmp/panestra-cli-release-check ./cmd/panestra
      - name: Verify third-party notices
        run: |
          scripts/generate-third-party-notices.sh
          git diff --exit-code -- THIRD_PARTY_NOTICES
      - run: scripts/verify-release_test.sh
      - run: sh -n scripts/*.sh
      - name: Validate adapter JSON
        run: |
          python3 -m json.tool adapters/codex/hooks/hooks.json >/dev/null
          python3 -m json.tool adapters/claude/hooks/hooks.json >/dev/null

  release-guard:
    needs: quality
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify release tag and version
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          go build -o /tmp/panestra-release-guard ./cmd/panestra
          scripts/verify-release.sh "$GITHUB_REF_NAME" origin/main /tmp/panestra-release-guard
      - name: Confirm dry-run mode
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual runs validate artifacts without publishing."

  homebrew-preflight:
    needs: quality
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Verify Homebrew release configuration
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_ENABLED: ${{ vars.HOMEBREW_TAP_ENABLED }}
        run: |
          test "$TAP_ENABLED" = true
          test -n "$GH_TOKEN"
          test "$(gh api repos/fru180/homebrew-tap --jq .default_branch)" = main
      - name: Confirm dry-run mode
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual runs do not require Homebrew publishing credentials."

  build:
    needs: [release-guard, homebrew-preflight]
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Build archive
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/panestra ./cmd/panestra
          cp LICENSE THIRD_PARTY_NOTICES dist/
          if [ "$GOARCH" = amd64 ]; then release_arch=x86_64; else release_arch=$GOARCH; fi
          archive="panestra-cli_Darwin_${release_arch}.tar.gz"
          tar -C dist -czf "$archive" panestra LICENSE THIRD_PARTY_NOTICES
          contents=$(tar -tzf "$archive" | LC_ALL=C sort)
          expected=$(printf '%s\n' LICENSE THIRD_PARTY_NOTICES panestra | LC_ALL=C sort)
          if [ "$contents" != "$expected" ]; then
            printf 'Unexpected archive contents:\n%s\n' "$contents" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: panestra-cli_Darwin_*.tar.gz

  validate:
    needs: build
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
      - name: Verify release archives
        run: |
          test -f panestra-cli_Darwin_arm64.tar.gz
          test -f panestra-cli_Darwin_x86_64.tar.gz
      - name: Generate arm64 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: panestra-cli_Darwin_arm64.tar.gz
          format: spdx-json
          output-file: panestra-cli_Darwin_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate x86_64 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: panestra-cli_Darwin_x86_64.tar.gz
          format: spdx-json
          output-file: panestra-cli_Darwin_x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Prepare release bundle
        run: |
          python3 -m json.tool panestra-cli_Darwin_arm64.spdx.json >/dev/null
          python3 -m json.tool panestra-cli_Darwin_x86_64.spdx.json >/dev/null
          shasum -a 256 panestra-cli_Darwin_*.tar.gz panestra-cli_Darwin_*.spdx.json > checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            panestra-cli_Darwin_arm64.tar.gz
            panestra-cli_Darwin_x86_64.tar.gz
            panestra-cli_Darwin_arm64.spdx.json
            panestra-cli_Darwin_x86_64.spdx.json
            checksums.txt

  attest:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Attest arm64 build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: panestra-cli_Darwin_arm64.tar.gz
      - name: Attest x86_64 build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: panestra-cli_Darwin_x86_64.tar.gz
      - name: Attest arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: panestra-cli_Darwin_arm64.tar.gz
          sbom-path: panestra-cli_Darwin_arm64.spdx.json
      - name: Attest x86_64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: panestra-cli_Darwin_x86_64.tar.gz
          sbom-path: panestra-cli_Darwin_x86_64.spdx.json

  publish:
    needs: attest
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" panestra-cli_Darwin_*.tar.gz panestra-cli_Darwin_*.spdx.json checksums.txt --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  homebrew:
    needs: publish
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Clone fru180/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/fru180/homebrew-tap.git" tap
          git -C tap remote set-url origin https://github.com/fru180/homebrew-tap.git
      - name: Update formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          arm_sha=$(shasum -a 256 panestra-cli_Darwin_arm64.tar.gz | awk '{print $1}')
          intel_sha=$(shasum -a 256 panestra-cli_Darwin_x86_64.tar.gz | awk '{print $1}')
          version=${TAG#v}
          sed -e "s/@VERSION@/$version/g" -e "s/@ARM64_SHA@/$arm_sha/g" -e "s/@X86_64_SHA@/$intel_sha/g" Formula/panestra-cli.rb.tmpl > tap/Formula/panestra-cli.rb
          ruby -c tap/Formula/panestra-cli.rb
          cd tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/panestra-cli.rb
          git commit -m "panestra-cli ${TAG}"
      - name: Push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tap_branch=$(git -C tap branch --show-current)
          git -C tap push "https://x-access-token:${TAP_TOKEN}@github.com/fru180/homebrew-tap.git" "HEAD:${tap_branch}"
