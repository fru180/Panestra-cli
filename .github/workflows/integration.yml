name: tmux-integration

on:
  workflow_dispatch:
  push:
    branches: [stg]
  pull_request:
    paths:
      - 'internal/tmux/**'
      - 'internal/hook/**'
      - 'internal/launcher/**'
      - 'assets/**'

permissions:
  contents: read

jobs:
  tmux:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install tmux
      - run: go test -v -count=1 ./internal/tmux ./internal/hook ./internal/launcher
